<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="hGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#3b82f6;#06b6d4;#a855f7" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#9333ea;#3b82f6;#38bdf8" dur="5s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <linearGradient id="bgBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Rounded container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#0d0e24" stroke="url(#bgBorder)" stroke-width="2.5" />
  
  <!-- Subtle inner radial glow -->
  <circle cx="32" cy="32" r="22" fill="#7c3aed" opacity="0.15">
    <animate attributeName="opacity" values="0.15;0.35;0.15" dur="3s" repeatCount="indefinite" />
  </circle>

  <!-- Futuristic letter H -->
  <path d="M18 15 h7 v13 h14 v-13 h7 v34 h-7 v-14 h-14 v14 h-7 z" fill="url(#hGrad)" filter="url(#glow)">
    <animate attributeName="opacity" values="0.9;1;0.9" dur="2.5s" repeatCount="indefinite" />
  </path>
</svg>
