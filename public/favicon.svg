<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="hGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#38bdf8" />
      <stop offset="85%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#facc15" stop-opacity="0.8" />
    </linearGradient>
    <filter id="neon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Obsidian Cosmic Glass Container -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="16" fill="#060914" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Inner Concentric Orbit Ring -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="#00f0ff" stroke-width="0.75" stroke-dasharray="3 4" opacity="0.35" />

  <!-- Radial Core Glow -->
  <circle cx="32" cy="32" r="16" fill="#00f0ff" opacity="0.18">
    <animate attributeName="opacity" values="0.14;0.28;0.14" dur="3s" repeatCount="indefinite" />
  </circle>

  <!-- Laser-Cut High-Precision Metallic "H" Monogram -->
  <path
    d="M19 14.5 h6.5 v14 h13 v-14 h6.5 v35 h-6.5 v-15 h-13 v15 h-6.5 z"
    fill="url(#hGrad)"
    filter="url(#neon)"
  />
</svg>
